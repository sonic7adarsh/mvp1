[build]
  # Robust Build Command:
  # 1. Checks if we are at Root (package.json has 'workspaces').
  # 2. If Root: Installs, Builds, and copies artifacts to ./dist (so publish="dist" works).
  # 3. If Subdir: Moves to Root, Installs, Builds. (Artifacts land in apps/seller-web/dist, which is ./dist relative to subdir).
  
  command = 'if [ -f "package.json" ] && grep -q "workspaces" "package.json"; then npm install && npm run build --workspace=seller-web && rm -rf dist && cp -r apps/seller-web/dist dist; else cd ../.. && npm install && npm run build --workspace=seller-web; fi'
  
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
