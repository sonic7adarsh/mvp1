[build]
  # We assume Base Directory is set to "apps/seller-web" in Netlify UI.
  # This command goes up to root, installs dependencies, and builds the seller-web workspace.
  command = "cd ../.. && npm install && npm run build --workspace=seller-web"
  
  # The build output will be in apps/seller-web/dist (relative to root).
  # Since Base Directory is apps/seller-web, this is just "dist".
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
