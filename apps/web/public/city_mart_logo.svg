<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Group for Icon 
       Adjustments:
       - Scale: 0.95 (Slightly smaller to fit better)
       - Translate: Moved UP (-50) to fix overlap with text. Moved RIGHT (25) to center mathematically.
       - Color: All Black (#000000)
       - Stroke: Reduced to 20 for sharper look.
  -->
  <g transform="translate(25, -50) scale(0.95)">
      <!-- City Skyline inside the Cart -->
      <!-- Buildings -->
      <path d="M160 250 V 160 H 200 V 250" fill="#000000" />
      <path d="M210 250 V 120 H 260 V 250" fill="#000000" />
      <path d="M270 250 V 150 H 320 V 250" fill="#000000" />
      <path d="M330 250 V 180 H 370 V 250" fill="#000000" />

      <!-- Shopping Cart Lines -->
      <!-- Handle -->
      <path d="M80 80 H 130 L 160 250" stroke="#000000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Basket Bottom/Side -->
      <path d="M160 250 L 190 350 H 400 L 440 250 H 160" stroke="#000000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Wheels -->
      <circle cx="210" cy="390" r="30" fill="#000000" />
      <circle cx="380" cy="390" r="30" fill="#000000" />

      <!-- Fresh Leaf Accent on Handle -->
      <path d="M80 80 Q 50 40 80 10 Q 110 40 80 80" fill="#000000" />
  </g>

  <!-- Brand Name Text -->
  <text x="50%" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="96" fill="#000000" letter-spacing="4">CMART</text>
</svg>