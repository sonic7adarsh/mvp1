<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Group for Icon 
       Adjustments:
       - Scale: 0.95 (Slightly smaller to fit better)
       - Translate: Moved UP (-50) to fix overlap with text. Moved RIGHT (25) to center mathematically.
       - Color: All Black (#000000)
       - Stroke: Reduced to 20 for sharper look.
  -->
  <g transform="translate(0, -50) scale(0.95)">
      <!-- McDonald's Style Arches 'M' inside the Cart -->
      <!-- Path draws two arches:
           1. Left Arch: Starts bottom-left, curves up and down to center.
           2. Right Arch: Starts center, curves up and down to bottom-right.
           Stroke width gives it the body.
      -->
      <path d="M 220 330 Q 220 130 300 230 Q 380 130 380 330" 
            fill="none" 
            stroke="#000000" 
            stroke-width="40" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Shopping Cart Lines -->
      <!-- Handle -->
      <!-- Adjusted: Connects to y=160 instead of y=250 to shorten the visual handle length -->
      <path d="M80 80 H 130 L 160 160" stroke="#000000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Basket Bottom/Side -->
      <!-- Adjusted: Top rim raised from y=250 to y=160 to make the basket much deeper/taller -->
      <path d="M160 160 L 190 350 H 400 L 440 160 H 160" stroke="#000000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Wheels -->
      <circle cx="210" cy="390" r="30" fill="#000000" />
      <circle cx="380" cy="390" r="30" fill="#000000" />

      <!-- Fresh Leaf Accent on Handle -->
      <path d="M80 80 Q 50 40 80 10 Q 110 40 80 80" fill="#000000" />
  </g>

  <!-- Brand Name Text -->
  <text x="50%" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="96" fill="#000000" letter-spacing="4">CMART</text>
</svg>